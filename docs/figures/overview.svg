<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="desc">
<desc id="desc">Conv-DLGN encodes an image, applies local depth-three logic-tree convolutions and OR pooling, and reads out a sparse logic head. The tree inset contains eight leaves and seven two-input gates.</desc>
