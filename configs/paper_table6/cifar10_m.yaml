model:
  family: "logictreenet"
  dataset: "cifar10"
  size: "M"
  profile_source: "paper_table6"
  num_classes: 10

data:
  dataset: "cifar10"
  cifar10_input_mode: "small"
  data_dir: "data"

training:
  max_epochs: 50
  device: "cuda"

logging:
  evaluate_test_during_training: false
  log_soft_hard_consistency: false

checkpoint:
  save_dir: "checkpoints/logictree/cifar10_m"
  seed: 0
